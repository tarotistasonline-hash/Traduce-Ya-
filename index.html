    <script>
      // Gracefully prevent benign preview errors (WebSocket, mic permission in iframe, SpeechRecognition) from bubbling to AI Studio error harness
      window.addEventListener('error', function(e) {
        if (!e) return;
        var msg = (e.message || '') + ' ' + (e.filename || '');
        if (
          msg.includes('WebSocket') ||
          msg.includes('@vite/client') ||
          msg.includes('microphone') ||
          msg.includes('getUserMedia') ||
          msg.includes('SpeechRecognition') ||
          msg.includes('NotAllowedError') ||
          msg.includes('audio') ||
          msg.includes('AudioContext')
        ) {
          e.preventDefault?.();
          e.stopImmediatePropagation?.();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (!e) return;
        var str = String(e.reason || '');
        if (
          str.includes('WebSocket') ||
          str.includes('@vite/client') ||
          str.includes('microphone') ||
          str.includes('getUserMedia') ||
          str.includes('SpeechRecognition') ||
          str.includes('NotAllowedError') ||
          str.includes('audio') ||
          str.includes('AudioContext')
        ) {
          e.preventDefault?.();
          e.stopImmediatePropagation?.();
          return true;
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
