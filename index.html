    <script>
      // Gracefully prevent benign Vite HMR WebSocket closure notices in preview iframe
      window.addEventListener('error', function(e) {
        if (e && (
          (e.message && e.message.includes('WebSocket')) ||
          (e.filename && e.filename.includes('@vite/client'))
        )) {
          e.preventDefault?.();
          e.stopImmediatePropagation?.();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && String(e.reason).includes('WebSocket')) {
          e.preventDefault?.();
          e.stopImmediatePropagation?.();
          return true;
        }
      }, true);
    </script>
